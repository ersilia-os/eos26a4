Identifier: eos26a4
Slug: lazychemvis-coconut
Status: Ready
Title: 2D Projector trained on Coconut
Description: Locates a molecule within COCONUT, a collection of roughly 715,000 open natural products, using PCA, UMAP, t-SNE and TMAP projections computed from ECFP4 fingerprints and RDKit descriptors. Comparing a compound against natural product space is useful when assessing whether synthetic chemistry has strayed into or away from the structural territory that produces bioactive metabolites. Coordinates are defined relative to this reference set and cannot be compared with projections built on other libraries.
